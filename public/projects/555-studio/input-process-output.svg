<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title>Input, process, output, with attention curating the people and creating momentum</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a3a3" />
    </marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a0a0a" />
    </marker>
  </defs>

  <g fill="#fff" stroke="#e5e5e5" stroke-width="1">
    <rect x="10" y="30" width="160" height="140" rx="6" />
    <rect x="220" y="30" width="160" height="140" rx="6" />
    <rect x="430" y="30" width="160" height="140" rx="6" />
  </g>

  <g stroke="#a3a3a3" stroke-width="1.25" fill="none" marker-end="url(#arrow)">
    <path d="M176 100 H214" />
    <path d="M386 100 H424" />
  </g>

  <g font-size="10" fill="#a3a3a3" letter-spacing="0.5">
    <text x="26" y="54">01 INPUT</text>
    <text x="236" y="54">02 PROCESS</text>
    <text x="446" y="54">03 OUTPUT</text>
  </g>

  <g font-size="15" font-weight="500" fill="#0a0a0a">
    <text x="26" y="78">Brilliant people</text>
    <text x="236" y="78">A designed room</text>
    <text x="446" y="78">Momentum</text>
  </g>

  <g font-size="12" fill="#525252">
    <text x="26" y="108">Scientists &amp; artists</text>
    <text x="26" y="128">Entrepreneurs</text>
    <text x="26" y="148">Different ideologies</text>

    <text x="236" y="108">Network effects</text>
    <text x="236" y="128">Curation</text>
    <text x="236" y="148">Personalization</text>

    <text x="446" y="108">Feeling seen</text>
    <text x="446" y="128">New collaborators</text>
    <text x="446" y="148">Ideas acted on</text>
  </g>

  <rect x="200" y="226" width="200" height="40" rx="20" fill="#0a0a0a" />
  <text x="300" y="251" font-size="13" font-weight="500" fill="#fff" text-anchor="middle">Attention</text>

  <g stroke="#0a0a0a" stroke-width="1.25" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow-dark)">
    <path d="M200 246 C 90 246, 90 230, 90 176" />
    <path d="M400 246 C 510 246, 510 230, 510 176" />
  </g>

  <g font-size="11" fill="#525252" font-style="italic">
    <text x="100" y="222">curates</text>
    <text x="500" y="222" text-anchor="end">creates</text>
  </g>

  <text x="300" y="296" font-size="11" fill="#a3a3a3" text-anchor="middle">Does putting brilliant people in one room turn isolated potential into momentum?</text>
</svg>
